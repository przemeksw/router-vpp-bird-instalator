  triggers:
    -
      uuid: '2fbf784687fd4dfb944f34c37e338f17'
      expression: 'last(/Router VPP BIRD by SNMP/rvDataAge)>{$RV.DATA.AGE.MAX}'
      name: 'Router: brak świeżych danych router-snmp (usługa router-snmp)'
      priority: 'WARNING'
    -
      uuid: '3afcbf4f6f5541b6a169e6f16f4d7d04'
      expression: 'last(/Router VPP BIRD by SNMP/rvVppUp)=0'
      name: 'VPP nie odpowiada'
      priority: 'DISASTER'
    -
      uuid: '1b41246a154b4defbfdb875abae793aa'
      expression: 'min(/Router VPP BIRD by SNMP/rvVppVectorMax,5m)>={$RV.VECTOR.CRIT}'
      name: 'VPP: worker przeciążony (wektor {ITEM.LASTVALUE1})'
      priority: 'HIGH'
    -
      uuid: '605ac493368b4fbbb313b2ef33dd952a'
      expression: 'min(/Router VPP BIRD by SNMP/rvVppVectorMax,5m)>={$RV.VECTOR.WARN} and max(/Router VPP BIRD by SNMP/rvVppVectorMax,5m)<{$RV.VECTOR.CRIT}'
      name: 'VPP: wysokie obciążenie workera (wektor {ITEM.LASTVALUE1})'
      priority: 'WARNING'
    -
      uuid: 'f1e225c5c98a4a8a8629c1d10b79741b'
      expression: 'min(/Router VPP BIRD by SNMP/rvVppRxMissPps,5m)>{$RV.RXMISS.MAX}'
      name: 'VPP: karta gubi pakiety na wejściu (rx-miss {ITEM.LASTVALUE1})'
      priority: 'HIGH'
    -
      uuid: '4f5e8e270a9b4d0b87499fe03a636796'
      expression: 'min(/Router VPP BIRD by SNMP/rvVppNicDiscardPps,5m)>{$RV.DISCARD.MAX}'
      name: 'VPP: karta odrzuca pakiety sprzętowo ({ITEM.LASTVALUE1})'
      priority: 'AVERAGE'
    -
      uuid: '41deffb074de4f2a8aa4e7095ce92a7f'
      expression: 'min(/Router VPP BIRD by SNMP/rvVppPuntPps,5m)>{$RV.PUNT.MAX}'
      name: 'VPP: duży ruch do control plane ({ITEM.LASTVALUE1})'
      priority: 'WARNING'
    -
      uuid: 'ec259c74497f430ebad0a75067e830fd'
      expression: 'min(/Router VPP BIRD by SNMP/rvVppHkCpuMax,5m)>{$RV.HKCPU.MAX}'
      name: 'System: przeciążony rdzeń systemowy (BIRD/SNMP)'
      priority: 'WARNING'
    -
      uuid: '805b67a4ef8b4837b6cdb33ee0b153f3'
      expression: 'last(/Router VPP BIRD by SNMP/rvVppBufFreePct)<{$RV.BUF.FREE.MIN}'
      name: 'VPP: kończą się bufory ({ITEM.LASTVALUE1} wolnych)'
      priority: 'HIGH'
    -
      uuid: '8fa9fcb6b0a24777b4acd2b0a35a3b89'
      expression: 'min(/Router VPP BIRD by SNMP/rvFibDiffPct,15m)>{$RV.FIB.DIFF.MAX}'
      name: 'FIB VPP różni się od tablicy BIRD ({ITEM.LASTVALUE1})'
      priority: 'AVERAGE'
    -
      uuid: '9e29073a2d184ea4a30df0e29e551a10'
      expression: 'last(/Router VPP BIRD by SNMP/rvIfacesDrift)=1'
      name: 'Interfejsy VPP różnią się od ifaces.conf (router-ifaces check)'
      priority: 'WARNING'
    -
      uuid: '94244be9392b4dce8aeeb072ed2768b4'
      expression: 'last(/Router VPP BIRD by SNMP/rvFwDrift)=1'
      name: 'Firewall: ACL w VPP różnią się od konfiguracji (router-fw check)'
      priority: 'HIGH'
    -
      uuid: '096f11df012d4e0eb798f121775c3a8a'
      expression: 'last(/Router VPP BIRD by SNMP/rvGuardDrift)=1'
      name: 'Guard: VPP różni się od stanu router-guard'
      priority: 'WARNING'
    -
      uuid: '61108e3f88614a18938bdc665a97b8ad'
      expression: 'last(/Router VPP BIRD by SNMP/rvGuardTable4Pct)>{$RV.GUARD.TABLE.MAX} or last(/Router VPP BIRD by SNMP/rvGuardTable6Pct)>{$RV.GUARD.TABLE.MAX}'
      name: 'Guard: tablica prawie pełna'
      priority: 'WARNING'
    -
      uuid: 'e3c1004c46cd4389be40bf1e83687c2b'
      expression: 'last(/Router VPP BIRD by SNMP/rvRpkiValidatorUp)=0'
      name: 'RPKI: Routinator nie działa (po 1 h bez danych BIRD przestaje odrzucać INVALID)'
      priority: 'HIGH'
    -
      uuid: 'f72ce07ebf9f4150b883d97b727b07db'
      expression: 'last(/Router VPP BIRD by SNMP/rvRpkiCheckAge)>900'
      name: 'RPKI: kontrola router-rpki nie działa (timer router-rpki-check)'
      priority: 'WARNING'
    -
      uuid: '825b7a512c3447f1900816c1828d458c'
      expression: 'last(/Router VPP BIRD by SNMP/rvAlarmsCritHour)>0'
      name: 'Router: alarm krytyczny w alarmy.log w ostatniej godzinie'
      priority: 'AVERAGE'
