# Generowany: tools/build-templates.py (instalator routera) — nie edytuj ręcznie
mib: ROUTER-VPP-MIB
modules:
    sensors:
        state:
            data:
                -
                    oid: 'rvVppUp'
                    value: 'rvVppUp'
                    num_oid: '.1.3.6.1.4.1.8072.9999.9999.630.2.1.{{ $index }}'
                    descr: 'VPP'
                    index: 'rvVppUp.{{ $index }}'
                    group: 'VPP'
                    state_name: rvVppUp
                    states:
                        - { value: 0, generic: 2, graph: 0, descr: 'nie działa' }
                        - { value: 1, generic: 0, graph: 0, descr: 'działa' }
                -
                    oid: 'rvIfacesDrift'
                    value: 'rvIfacesDrift'
                    num_oid: '.1.3.6.1.4.1.8072.9999.9999.630.2.21.{{ $index }}'
                    descr: 'Interfejsy: zgodność z ifaces.conf'
                    index: 'rvIfacesDrift.{{ $index }}'
                    group: 'Router'
                    state_name: rvIfacesDrift
                    states:
                        - { value: 0, generic: 0, graph: 0, descr: 'zgodne' }
                        - { value: 1, generic: 1, graph: 0, descr: 'rozjazd' }
                -
                    oid: 'rvFwDrift'
                    value: 'rvFwDrift'
                    num_oid: '.1.3.6.1.4.1.8072.9999.9999.630.8.2.{{ $index }}'
                    descr: 'Firewall: zgodność ACL'
                    index: 'rvFwDrift.{{ $index }}'
                    group: 'Router'
                    state_name: rvFwDrift
                    states:
                        - { value: 0, generic: 0, graph: 0, descr: 'zgodne' }
                        - { value: 1, generic: 1, graph: 0, descr: 'rozjazd' }
                -
                    oid: 'rvGuardDrift'
                    value: 'rvGuardDrift'
                    num_oid: '.1.3.6.1.4.1.8072.9999.9999.630.9.13.{{ $index }}'
                    descr: 'Guard: zgodność'
                    index: 'rvGuardDrift.{{ $index }}'
                    group: 'Router'
                    state_name: rvGuardDrift
                    states:
                        - { value: 0, generic: 0, graph: 0, descr: 'zgodne' }
                        - { value: 1, generic: 1, graph: 0, descr: 'rozjazd' }
                -
                    oid: 'rvGuardMode'
                    value: 'rvGuardMode'
                    num_oid: '.1.3.6.1.4.1.8072.9999.9999.630.9.2.{{ $index }}'
                    descr: 'Guard: tryb'
                    index: 'rvGuardMode.{{ $index }}'
                    group: 'Router'
                    state_name: rvGuardMode
                    states:
                        - { value: 0, generic: 3, graph: 0, descr: 'off' }
                        - { value: 1, generic: 1, graph: 0, descr: 'monitor' }
                        - { value: 2, generic: 0, graph: 0, descr: 'enforce' }
                -
                    oid: 'rvRpkiValidatorUp'
                    value: 'rvRpkiValidatorUp'
                    num_oid: '.1.3.6.1.4.1.8072.9999.9999.630.14.3.{{ $index }}'
                    descr: 'RPKI: Routinator'
                    index: 'rvRpkiValidatorUp.{{ $index }}'
                    group: 'RPKI'
                    state_name: rvRpkiValidatorUp
                    states:
                        - { value: 0, generic: 2, graph: 0, descr: 'nie działa' }
                        - { value: 1, generic: 0, graph: 0, descr: 'działa' }
                -
                    oid: 'rvRpkiEnforce'
                    value: 'rvRpkiEnforce'
                    num_oid: '.1.3.6.1.4.1.8072.9999.9999.630.14.1.{{ $index }}'
                    descr: 'RPKI: odrzucanie INVALID'
                    index: 'rvRpkiEnforce.{{ $index }}'
                    group: 'RPKI'
                    state_name: rvRpkiEnforce
                    states:
                        - { value: 0, generic: 0, graph: 0, descr: 'tylko podgląd' }
                        - { value: 1, generic: 0, graph: 0, descr: 'odrzucanie' }
                -
                    oid: 'rvBgpPeerTable'
                    value: 'rvBgpPeerState'
                    num_oid: '.1.3.6.1.4.1.8072.9999.9999.630.6.1.6.{{ $index }}'
                    descr: 'BGP {{ $rvBgpPeerName }} {{ $rvBgpPeerNeighbor }} {{ $rvBgpPeerDescr }}'
                    index: 'rvBgpPeerState.{{ $index }}'
                    group: 'BGP'
                    state_name: rvBgpPeerState
                    states:
                        - { value: 1, generic: 2, graph: 0, descr: 'idle' }
                        - { value: 2, generic: 1, graph: 0, descr: 'connect' }
                        - { value: 3, generic: 2, graph: 0, descr: 'active' }
                        - { value: 4, generic: 1, graph: 0, descr: 'opensent' }
                        - { value: 5, generic: 1, graph: 0, descr: 'openconfirm' }
                        - { value: 6, generic: 0, graph: 0, descr: 'established' }
                -
                    oid: 'rvServiceTable'
                    value: 'rvServiceUp'
                    num_oid: '.1.3.6.1.4.1.8072.9999.9999.630.7.1.3.{{ $index }}'
                    descr: 'Usługa {{ $rvServiceName }}'
                    index: 'rvServiceUp.{{ $index }}'
                    group: 'Usługi'
                    state_name: rvServiceUp
                    states:
                        - { value: 0, generic: 2, graph: 0, descr: 'nie działa' }
                        - { value: 1, generic: 0, graph: 0, descr: 'działa' }
                -
                    oid: 'rvRpkiTable'
                    value: 'rvRpkiUp'
                    num_oid: '.1.3.6.1.4.1.8072.9999.9999.630.10.1.3.{{ $index }}'
                    descr: 'RPKI {{ $rvRpkiName }}'
                    index: 'rvRpkiUp.{{ $index }}'
                    group: 'RPKI'
                    state_name: rvRpkiUp
                    states:
                        - { value: 0, generic: 2, graph: 0, descr: 'nie działa' }
                        - { value: 1, generic: 0, graph: 0, descr: 'działa' }
                -
                    oid: 'rvRaidTable'
                    value: 'rvRaidDegraded'
                    num_oid: '.1.3.6.1.4.1.8072.9999.9999.630.11.1.3.{{ $index }}'
                    descr: 'RAID {{ $rvRaidName }} {{ $rvRaidLevel }}'
                    index: 'rvRaidDegraded.{{ $index }}'
                    group: 'RAID'
                    state_name: rvRaidDegraded
                    states:
                        - { value: 0, generic: 0, graph: 0, descr: 'sprawna' }
                        - { value: 1, generic: 2, graph: 0, descr: 'zdegradowana' }
                -
                    oid: 'rvDiskTable'
                    value: 'rvDiskHealthOk'
                    num_oid: '.1.3.6.1.4.1.8072.9999.9999.630.12.1.4.{{ $index }}'
                    descr: 'SMART {{ $rvDiskName }} {{ $rvDiskModel }}'
                    index: 'rvDiskHealthOk.{{ $index }}'
                    group: 'Dyski'
                    state_name: rvDiskHealthOk
                    states:
                        - { value: 0, generic: 2, graph: 0, descr: 'FAILED' }
                        - { value: 1, generic: 0, graph: 0, descr: 'PASSED' }
        count:
            data:
                -
                    oid: 'rvVppVectorMax'
                    value: 'rvVppVectorMax'
                    num_oid: '.1.3.6.1.4.1.8072.9999.9999.630.2.2.{{ $index }}'
